<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agents · Agentic Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Direction A — Ledger (achromatic-ledger, seed 420918770)
  Move: no colour in the chrome. Money in ink, the one hue (#1d5fbf) only on what an agent may still spend.
  Face: a blue-grey ledger ground (#f2f4f7) and every figure in Spline Sans Mono, read as a statement's columns.
  Signature: the mandate envelope — total budget as a bar, spent in ink, remaining in the hue, a tick at the per-purchase cap.
  Grid: rail 56 + canvas; canvas padding 32; one gap 12.
-->
<style>
:root{
  --ground:#f2f4f7;--surface:#fff;--raised:#eceef2;--border:#e3e6eb;--rule:#eef0f3;--control:#cfd3da;
  --text:#0a0a0a;--muted:#5f6670;--accent:#141414;--hue:#1d5fbf;--hue-pale:#dbe6f6;
  --positive:#2e7d32;--negative:#c4242a;--warning:#92400e;
  --pill-positive-bg:#dcfae5;--pill-positive-ink:#04250e;--pill-neutral-bg:#eceef2;--pill-neutral-ink:#3d3d3d;--pill-negative-bg:#ffedea;--pill-negative-ink:#831c1e;
  --r-card:8px;--r-control:6px;--gap:12px;--pad:24px;
  --sans:"Schibsted Grotesk",system-ui,sans-serif;--mono:"Spline Sans Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.app{display:grid;grid-template-columns:56px 1fr;min-height:100vh}
/* rail */
.rail{border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;position:sticky;top:0;height:100vh}
.rail a{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r-control);color:var(--muted)}
.rail a[aria-current]{color:var(--text);background:var(--raised)}
.rail a:hover{color:var(--text)}
.rail a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
.rail .mark{margin-bottom:18px}
.rail .sp{flex:1}
/* canvas */
main{padding:28px 32px 48px;min-width:0}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:24px;font-weight:500;margin:0;letter-spacing:-.01em}
.lede{margin:4px 0 0;color:var(--muted)}
.lede b{color:var(--text);font-weight:500}
.btn{height:36px;padding:0 14px;border-radius:var(--r-control);border:0;font:500 14px var(--sans);cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
.btn.sec{background:var(--raised);color:var(--text)}
.btn:hover{background:#2b2b2b}.btn.sec:hover{background:#e2e5ea}
/* totals strip: one divided card */
.totals{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:var(--gap)}
.totals div{padding:18px var(--pad)}
.totals div+div{border-left:1px solid var(--border)}
.totals dt{color:var(--muted);font-size:13px}
.totals dd{margin:6px 0 0;font-size:28px;letter-spacing:-.02em}
.totals dd.hue{color:var(--hue);font-weight:500}
.totals small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-family:var(--sans)}
/* ledger */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:16px var(--pad) 8px}
.panel h2{font-size:16px;font-weight:500;margin:0}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:left;padding:8px 12px}
th:first-child,td:first-child{padding-left:var(--pad)}th:last-child,td:last-child{padding-right:var(--pad)}
td{padding:14px 12px;border-top:1px solid var(--rule);vertical-align:middle}
.r{text-align:right}
tr.off td{color:var(--muted)}
tbody tr:hover{background:#fafbfc}
.agent b{font-weight:500;display:block}
.agent span{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
.pill.n{background:var(--pill-neutral-bg);color:var(--pill-neutral-ink)}
.pill.live{background:var(--hue-pale);color:#0d3470}
.pill.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--hue);margin-right:6px;vertical-align:1px;}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
/* envelope */
.env{width:220px}
.bar{position:relative;height:8px;background:var(--hue-pale);border-radius:2px}
.bar .spent{position:absolute;inset:0 auto 0 0;background:var(--text);border-radius:2px 0 0 2px}
.bar .cap{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text)}
tr.off .bar{background:var(--raised)}tr.off .bar .spent{background:#9aa0a8}
.env small{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.left{font-weight:700}
.left.hue{color:var(--hue)}
.zero{color:var(--muted)}
.ghost{background:none;border:0;color:var(--text);font:500 14px var(--sans);cursor:pointer;padding:6px 8px;border-radius:var(--r-control)}
.ghost:hover{background:var(--raised)}
/* lower row: 8/4 */
.lower{display:grid;grid-template-columns:2fr 1fr;gap:var(--gap);margin-top:var(--gap);align-items:start}
.list{list-style:none;margin:0;padding:0 var(--pad) 12px}
.list li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--rule)}
.list li span{color:var(--muted);font-size:12px}
.trace{padding:0 var(--pad) 16px;margin:0;list-style:none}
.trace li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--rule)}
.trace time{color:var(--muted);font-size:12px}
.trace li.now{color:var(--hue)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;bottom:0;top:auto;height:56px;width:100%;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--border);background:var(--ground);z-index:2;padding:0}
  .rail .mark,.rail .sp{display:none}
  main{padding:20px 16px 88px}
  .totals{grid-template-columns:1fr 1fr}.totals div:nth-child(3){border-left:0}.totals div:nth-child(n+3){border-top:1px solid var(--border)}
  .totals dd{font-size:22px}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-top:1px solid var(--rule)}
  td{border:0;padding:0!important}
  td.c-env{grid-column:1/-1}.env{width:100%}
  td.c-spent,td.c-cap,td.c-exp{display:none}
  .lower{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <a class="mark" href="#" aria-label="Agentic Market home">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="6" fill="#141414"/><path d="M7 20V8h14" stroke="#fff" stroke-width="2.4" fill="none"/><path d="M11 20h10" stroke="#5b8fe0" stroke-width="2.4"/></svg>
    </a>
    <a href="#" aria-current="page" aria-label="Agents" title="Agents"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
    <a href="#" aria-label="Orders" title="Orders"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 4h14v17l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/></svg></a>
    <span class="sp"></span>
    <a href="#" aria-label="Log out" title="Log out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg></a>
  </nav>

  <main>
    <div class="title">
      <div>
        <h1>Agents</h1>
        <p class="lede" id="lede"></p>
      </div>
      <button class="btn" aria-expanded="false">New agent</button>
    </div>

    <dl class="totals" id="totals"></dl>

    <section class="panel" aria-labelledby="h-mandates">
      <header>
        <h2 id="h-mandates">Mandates</h2>
        <div class="legend" aria-hidden="true"><span><i style="background:#0a0a0a"></i>Spent</span><span><i style="background:#1d5fbf"></i>Left</span><span><i style="background:#0a0a0a;width:2px"></i>Per-purchase cap</span></div>
      </header>
      <table>
        <thead><tr><th>Agent</th><th>Status</th><th>Budget</th><th class="r c-spent">Spent</th><th class="r">Left</th><th class="r c-cap">Per purchase</th><th class="c-exp">Ends</th><th><span class="sr">Action</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <div class="lower">
      <section class="panel" aria-labelledby="h-orders">
        <header><h2 id="h-orders">Latest orders</h2><a class="ghost" href="#">All 8 orders</a></header>
        <ul class="list" id="orders"></ul>
      </section>
      <section class="panel" aria-labelledby="h-run">
        <header><h2 id="h-run">Pantry restock is shopping</h2></header>
        <ol class="trace" id="trace" aria-live="polite"></ol>
      </section>
    </div>
  </main>
</div>

<script>
const TODAY=new Date("2026-10-26T15:20:00");
const agents=[
 {name:"Pantry restock",cats:["Groceries","Household"],cap:40,budget:200,orders:[22.90,34.60],ends:"2026-11-12T18:00",status:"live"},
 {name:"Coffee beans, monthly",cats:["Groceries"],cap:25,budget:75,orders:[24.20,24.20],ends:"2026-12-31T23:59",status:"active"},
 {name:"Birthday gift for Léa",cats:["Toys","Books"],cap:80,budget:80,orders:[],ends:"2026-10-31T20:00",status:"active"},
 {name:"Office supplies",cats:["Stationery"],cap:30,budget:120,orders:[30,30,30,30],ends:"2026-11-30T09:00",status:"exhausted"},
 {name:"Running shoes",cats:["Sport"],cap:140,budget:140,orders:[],ends:"2026-10-20T12:00",status:"expired"},
];
const cents=n=>Math.round(n*100);
agents.forEach(a=>{a.spentC=a.orders.reduce((s,o)=>s+cents(o),0);a.leftC=cents(a.budget)-a.spentC;a.on=a.status==="live"||a.status==="active";});
const eur=c=>"€"+(c/100).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const leftActive=agents.filter(a=>a.on).reduce((s,a)=>s+a.leftC,0);
const spentAll=agents.reduce((s,a)=>s+a.spentC,0);
const orderCount=agents.reduce((s,a)=>s+a.orders.length,0);
const activeCount=agents.filter(a=>a.on).length;
console.assert(leftActive===14250+2660+8000,"left total");
console.assert(spentAll===5750+4840+12000,"spent total");
const days=d=>Math.ceil((new Date(d)-TODAY)/864e5);
const ends=a=>{const n=days(a.ends);if(a.status==="expired")return `Ended ${new Date(a.ends).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`;return n<=7?`In ${n} days`:new Date(a.ends).toLocaleDateString("en-GB",{day:"numeric",month:"short"});};
document.getElementById("lede").innerHTML=`<b>${eur(leftActive)}</b> left to spend across ${activeCount} active mandates. One agent is shopping now.`;
document.getElementById("totals").innerHTML=`
<div><dt>Left to spend</dt><dd class="num hue">${eur(leftActive)}</dd><small>across ${activeCount} active mandates</small></div>
<div><dt>Spent</dt><dd class="num">${eur(spentAll)}</dd><small>all mandates, since 1 Oct</small></div>
<div><dt>Orders</dt><dd class="num">${orderCount}</dd><small>all paid (simulated)</small></div>
<div><dt>Next to end</dt><dd class="num">${days("2026-10-31T20:00")} days</dd><small>Birthday gift for Léa, 31 Oct</small></div>`;
const status={live:'<span class="pill live">Shopping</span>',active:'<span class="pill ok">Active</span>',exhausted:'<span class="pill n">Budget used up</span>',expired:'<span class="pill n">Expired</span>'};
document.getElementById("rows").innerHTML=agents.map(a=>{
 const sp=a.spentC/cents(a.budget)*100,cp=cents(a.cap)/cents(a.budget)*100;
 return `<tr class="${a.on?"":"off"}">
 <td class="agent"><b>${a.name}</b><span>${a.cats.join(" · ")}</span></td>
 <td>${status[a.status]}</td>
 <td class="c-env"><div class="env"><div class="bar" role="img" aria-label="${eur(a.spentC)} spent of ${eur(cents(a.budget))}"><span class="spent" style="width:${sp}%"></span>${cp<100?`<span class="cap" style="left:${cp}%"></span>`:""}</div><small><span class="num">${eur(cents(a.budget))} budget</span><span>${ends(a)}</span></small></div></td>
 <td class="r num c-spent ${a.spentC?"":"zero"}">${eur(a.spentC)}</td>
 <td class="r num left ${a.on&&a.leftC?"hue":"zero"}">${a.on?eur(a.leftC):"—"}</td>
 <td class="r num c-cap">${eur(cents(a.cap))}</td>
 <td class="c-exp">${ends(a)}</td>
 <td class="r">${a.on?`<button class="ghost">${a.status==="live"?"View run":"Start run"}</button>`:`<button class="ghost">Renew</button>`}</td></tr>`;}).join("");
const orders=[["Oat milk, 6 × 1 L","Pantry restock · Ocado","2026-10-26",34.60],["Ethiopia Guji, 1 kg","Coffee beans · Origin","2026-10-24",24.20],["A4 notebooks, 10 pack","Office supplies · Viking","2026-10-21",30],["Dishwasher tablets, 90","Pantry restock · Ocado","2026-10-19",22.90],["Gel pens, 24 pack","Office supplies · Viking","2026-10-15",30]];
document.getElementById("orders").innerHTML=orders.map(o=>`<li><b style="font-weight:500">${o[0]}</b><span class="num" style="color:var(--text);font-size:14px;grid-row:span 2;align-self:center">${eur(cents(o[3]))}</span><span>${o[1]} · ${new Date(o[2]).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></li>`).join("");
const trace=[["15:12","Read the mandate: €40.00 per purchase, groceries and household"],["15:13","Searched 3 merchants for “rice 5 kg”"],["15:15","Compared 4 offers; 1 over the cap, set aside"],["15:19","Choosing between Tilda 5 kg €11.40 and Ocado 5 kg €9.85",true]];
document.getElementById("trace").innerHTML=trace.map(t=>`<li class="${t[2]?"now":""}"><time class="num">${t[0]}</time><span>${t[1]}</span></li>`).join("");
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</body>
</html>
