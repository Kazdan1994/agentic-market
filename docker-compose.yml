services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: agentic_market
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_market"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
